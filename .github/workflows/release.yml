name: Release

# Every merge to main builds the Windows and macOS installers and publishes them on a GitHub release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  draft:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Create the draft
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v${version}-build.${{ github.run_number }}"
          id=$(gh api "repos/${{ github.repository }}/releases" \
            -f tag_name="$tag" \
            -f target_commitish="${{ github.sha }}" \
            -f name="nAccelerate ${version} (build ${{ github.run_number }})" \
            -f body="$(cat .github/release-notes.md)" \
            -F draft=true \
            -F generate_release_notes=true \
            --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --bundles nsis
            rust-targets: ""
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build and upload the installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          releaseId: ${{ needs.draft.outputs.id }}
          args: ${{ matrix.args }}

  publish:
    name: Publish release
    needs: [draft, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH "repos/${{ github.repository }}/releases/${{ needs.draft.outputs.id }}" \
            -F draft=false -f make_latest=true > /dev/null

  cleanup:
    name: Delete draft after a failed build
    needs: [draft, build]
    if: failure() && needs.draft.outputs.id != ''
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/${{ github.repository }}/releases/${{ needs.draft.outputs.id }}"
